style="stroke:#8B8B8B;stroke-width:1;" x1="64" x2="264" y1="175" y2="175"/><line style="stroke:#8B8B8B;stroke-width:1;" x1="264" x2="264" y1="175" y2="379"/><text fill="#9B9B9B" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2891" x="139.3555" y="188.0103">Desktop</text></g><!--entity phone--><g class="entity" data-qualified-name="Phone . mobile network.phone" data-source-line="26" id="ent0003"><rect fill="#1B1D1F" height="46" rx="4" ry="4" style="stroke:#8B8B8B;stroke-width:0.5;" width="197.0425" x="32.48" y="43"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="81.6499" x="42.48" y="63.0103">PlohoyStream</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="42.48" y="76.0103">capture &#183; encode &#183; SRT sender</text></g><!--entity server--><g class="entity" data-qualified-name="Server . VPS or LAN box.server" data-source-line="30" id="ent0005"><rect fill="#1B1D1F" height="46" rx="4" ry="4" style="stroke:#8B8B8B;stroke-width:0.5;" width="195.9253" x="422.04" y="43"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.4136" x="432.04" y="63.0103">SRS / MediaMTX</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="175.9253" x="432.04" y="76.0103">SRT + RTMP ingest, republish</text></g><!--entity obs--><g class="entity" data-qualified-name="Desktop.obs" data-source-line="34" id="ent0007"><rect fill="#1B1D1F" height="46" rx="4" ry="4" style="stroke:#8B8B8B;stroke-width:0.5;" width="178.9834" x="79.51" y="317"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="67.9263" x="89.51" y="337.0103">OBS Studio</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="158.9834" x="89.51" y="350.0103">media source pulls the feed</text></g><!--entity ws--><g class="entity" data-qualified-name="Desktop.ws" data-source-line="35" id="ent0008"><rect fill="#1B1D1F" height="46" rx="4" ry="4" style="stroke:#8B8B8B;stroke-width:0.5;" width="106.709" x="97.65" y="202"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="86.709" x="107.65" y="222.0103">obs-websocket</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3208" x="107.65" y="235.0103">scene control</text></g><!--entity platform--><g class="entity" data-qualified-name="platform" data-source-line="38" id="ent0009"><rect fill="#1B1D1F" height="46" rx="4" ry="4" style="stroke:#8B8B8B;stroke-width:0.5;" width="121.1563" x="440.42" y="317"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1563" x="450.42" y="337.0103">Twitch / YouTube</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="74.4326" x="450.42" y="350.0103">or any ingest</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="46" id="ent0016"><path d="M473.62,198 L473.62,252 A4,4 0 0 0 477.62,256 L728.3715,256 A4,4 0 0 0 732.3715,252 L732.3715,204 L722.3715,194 L591,194 L531.89,89.49 L583,194 L477.62,194 A4,4 0 0 0 473.62,198" fill="#1B1D1F" style="stroke:#8B8B8B;stroke-width:0.5;"/><path d="M722.3715,194 L722.3715,202 A2,2 0 0 0 724.3715,204 L732.3715,204 L722.3715,194" fill="#1B1D1F" style="stroke:#8B8B8B;stroke-width:0.5;"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2324" x="479.62" y="209.0103">The server absorbs the unreliable leg.</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2515" x="479.62" y="222.0103">A phone on mobile data never talks to</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="233.3589" x="479.62" y="235.0103">OBS directly &#8212; SRT hides jitter and loss</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="237.7515" x="479.62" y="248.0103">on the way in, so OBS sees a clean feed.</text></g><!--link phone to server--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="40" id="lnk10"><path d="M229.92,66 C288.67,66 356.9,66 415.56,66" fill="none" id="phone-to-server" style="stroke:#8B8B8B;stroke-width:1;"/><polygon fill="#8B8B8B" points="421.56,66,412.56,62,416.56,66,412.56,70,421.56,66" style="stroke:#8B8B8B;stroke-width:1;"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="26" x="283.1904" y="33.0103">SRT</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="56.3481" x="312.8022" y="33.0103">over UDP</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="149.2271" x="251.5569" y="46.0103">streamid + latency budget</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="156.7808" x="247.78" y="59.0103">recovers loss, keeps timing</text></g><!--link server to obs--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="41" id="lnk11"><path d="M444.03,89.35 C402.05,104.13 350.56,126.46 311,157 C280.15,180.82 217.6268,268.5679 187.7268,311.7279" fill="none" id="server-to-obs" style="stroke:#8B8B8B;stroke-width:1;"/><polygon fill="#8B8B8B" points="184.31,316.66,192.7233,311.5397,187.1573,312.5499,186.1472,306.984,184.31,316.66" style="stroke:#8B8B8B;stroke-width:1;"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.46" x="330.8113" y="222.0103">SRT or RTMP pull</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.0825" x="312" y="235.0103">inside the studio network</text></g><!--link obs to platform--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" data-source-line="42" id="lnk12"><path d="M258.84,340 C316.26,340 383.2,340 433.95,340" fill="none" id="obs-to-platform" style="stroke:#8B8B8B;stroke-width:1;"/><polygon fill="#8B8B8B" points="439.95,340,430.95,336,434.95,340,430.95,344,439.95,340" style="stroke:#8B8B8B;stroke-width:1;"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.5508" x="307.305" y="320.0103">final broadcast</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2407" x="276.96" y="333.0103">with overlays and scenes</text></g><!--link phone to ws--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" data-link-type="dependency" data-source-line="43" id="lnk13"><path d="M129.48,89.32 C128.89,99.05 128.29,110.58 128,121 C127.65,133.44 126.16,136.69 128,149 C130.73,167.18 134.9362,181.4052 140.2362,196.1152" fill="none" id="phone-to-ws" style="stroke:#8B8B8B;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#8B8B8B" points="142.27,201.76,142.9825,191.9369,140.5752,197.056,135.4561,194.6487,142.27,201.76" style="stroke:#8B8B8B;stroke-width:1;"/><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.1035" x="143.8091" y="132.0103">WebSocket control</text><text fill="#E6E4E1" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.7217" x="129" y="145.0103">switch scene &#183; start/stop</text></g><!--link ws to obs--><g class="link" data-entity-1="ent0008" data-entity-2="ent0007" data-link-type="dependency" data-source-line="44" id="lnk14"><path d="M154.56,248.33 C157.71,268.14 161.3573,290.9945 164.5073,310.7945" fill="none" id="ws-to-obs" style="stroke:#8B8B8B;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#8B8B8B" points="165.45,316.